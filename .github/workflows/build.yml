name: 求人ページを毎朝作り直す

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 21 * * *"   # 日本時間 6:40
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 案件一覧を読む（合言葉が設定されているときだけ。なければ data/jobs.json をそのまま使う）
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          if [ -n "$SHEET_URL" ]; then
            # 貼られたURLの形だけを確かめる（中身は表示しない）
            U="$SHEET_URL"
            echo "URLの長さ: ${#U}"
            case "$U" in "https://script.google.com/macros/s/"*"/exec?k="*) echo "URLの形: 本番用（/exec?k=）";; *) echo "URLの形: 想定とちがう";; esac
            case "$U" in *"/dev"*) echo "→ テスト用（/dev）のURLが入っています";; esac
            case "$U" in *" "*|*$'\n'*|*$'\t'*) echo "→ 空白や改行が混ざっています";; esac
            case "$U" in "https://"*) ;; *) echo "→ https:// で始まっていません（前に余計な文字があります）";; esac
            K="${U##*k=}"; echo "合言葉の長さ: ${#K}（正しくは64）"
            CODE=$(curl -sSL "$U" -o "$RUNNER_TEMP/raw.json" -w "%{http_code}" || true)
            echo "窓口の応答コード: $CODE"
            if [ "$(head -c 10 "$RUNNER_TEMP/raw.json")" != '{"values":' ]; then
              echo "読み取り窓口から求人データが返ってきませんでした。返ってきたページの種類:"
              grep -o '<title>[^<]*</title>' "$RUNNER_TEMP/raw.json" | head -1 || true
              head -c 30 "$RUNNER_TEMP/raw.json" | tr -c 'a-zA-Z{}":<>!' '.'; echo
              rm -f "$RUNNER_TEMP/raw.json"
              exit 1
            fi
            python3 build.py sanitize "$RUNNER_TEMP/raw.json" data/jobs.json
            rm -f "$RUNNER_TEMP/raw.json"
          fi
      - name: サイトを作る
        run: python3 build.py render data/jobs.json site
      - name: サイトに出している内容を①シートへ書き出す（修正用の列はそのまま残る）
        continue-on-error: true
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: |
          if [ -n "$SHEET_URL" ]; then python3 build.py push data/jobs.json; fi
      - name: Googleにつなぐ（掲載チェック用。読むだけ）
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/602632689388/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: indexing-notify@kyoei-jobs.iam.gserviceaccount.com
      - name: Googleに載ったかを確かめる（結果は keisai.html に残す）
        continue-on-error: true
        run: |
          pip install --quiet google-auth requests
          python3 check.py site
      - name: 増えた求人・終わった求人を調べる
        run: python3 build.py diff site diff.json
      - uses: actions/upload-artifact@v4
        with:
          name: diff
          path: diff.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diff
      - name: Googleにつなぐ（鍵ファイルなし。この置き場所の自動実行だけに許可してある）
        id: gauth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/602632689388/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: indexing-notify@kyoei-jobs.iam.gserviceaccount.com
      - name: Googleへ知らせる
        continue-on-error: true
        run: |
          pip install --quiet google-auth requests
          python3 notify.py diff.json
